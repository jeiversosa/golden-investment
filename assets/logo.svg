<svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16214b"/>
      <stop offset="55%" stop-color="#3d6b45"/>
      <stop offset="100%" stop-color="#e6b325"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16214b"/>
      <stop offset="55%" stop-color="#3d6b45"/>
      <stop offset="100%" stop-color="#e6b325"/>
    </linearGradient>
  </defs>

  <!-- G ring -->
  <path d="M120 20
           a100 100 0 1 0 70 171
           l0 -26
           a74 74 0 1 1 -49 -122"
        fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- water waves -->
  <g stroke="#16214b" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M78 176 q12 -10 24 0 t24 0 t24 0 t24 0"/>
    <path d="M78 190 q12 -10 24 0 t24 0 t24 0 t24 0"/>
  </g>

  <!-- bridge -->
  <g stroke="#16214b" stroke-width="4" fill="none">
    <path d="M96 152 h88" stroke-width="6" stroke-linecap="round"/>
    <path d="M104 152 v14 M120 152 v14 M136 152 v14 M152 152 v14 M168 152 v14"/>
    <path d="M108 166 a14 14 0 0 1 28 0" />
    <path d="M144 166 a14 14 0 0 1 28 0" />
  </g>

  <!-- tall building -->
  <rect x="92" y="70" width="20" height="86" fill="#e6b325"/>
  <rect x="96" y="78" width="4" height="70" fill="#fff" opacity="0.5"/>
  <rect x="112" y="90" width="16" height="66" fill="#3d6b45"/>

  <!-- small house -->
  <rect x="60" y="126" width="18" height="24" fill="#16214b"/>
  <polygon points="59,126 69,112 79,126" fill="#16214b"/>
  <rect x="66" y="136" width="6" height="14" fill="#fff" opacity="0.6"/>

  <!-- tree -->
  <circle cx="45" cy="112" r="12" fill="#3d6b45"/>
  <circle cx="37" cy="120" r="9" fill="#3d6b45"/>
  <circle cx="53" cy="120" r="9" fill="#3d6b45"/>
  <rect x="43" y="122" width="4" height="16" fill="#7a5230"/>

  <!-- road -->
  <path d="M20 178 C 55 150, 70 165, 96 156 S 130 176, 150 156"
        fill="none" stroke="#16214b" stroke-width="14" stroke-linecap="round"/>
  <path d="M20 178 C 55 150, 70 165, 96 156 S 130 176, 150 156"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.8"/>

  <!-- wordmark -->
  <text x="120" y="238" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-weight="700" font-size="30" fill="url(#textGrad)">Golden</text>
  <text x="120" y="270" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-weight="700" font-size="30" fill="url(#textGrad)">Investment</text>
</svg>
